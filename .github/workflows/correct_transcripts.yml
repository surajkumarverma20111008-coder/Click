name: Mr. Lawaris - Transcript Correction Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  correct-transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "❌ GEMINI_API_KEY missing"; exit 1; fi
          if [ -z "$HF_TOKEN" ]; then echo "❌ HF_TOKEN missing"; exit 1; fi
          echo "✅ Secrets OK"

      - name: Run pipeline
        run: python main.py

      - name: Summary
        if: always()
        run: |
          echo "=== Corrected files ==="
          ls ./corrected/ 2>/dev/null | wc -l || echo "0"
